name: PR Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Conventional Commit Title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Checking PR Title: $TITLE"
          REGEX="^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?: .+"
          if [[ ! $TITLE =~ $REGEX ]]; then
            echo "::error::PR title does not follow Conventional Commits specification."
            exit 1
          fi
          echo "Title conforms to convention."
